; PlatformIO Configuration for Kenny ESP32 Wheel Odometer & 1-Rev Accuracy Firmware
; Flash without Arduino IDE:
;   pio run -d firmware/esp32_wheel_odometer_test -e esp32dev -t upload --upload-port <left-port>
;   pio run -d firmware/esp32_wheel_odometer_test -e esp32dev_right -t upload --upload-port <right-port>

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -D DEFAULT_SIDE_LEFT=1

[env:esp32dev_right]
extends = env:esp32dev
build_flags =
    -D DEFAULT_SIDE_LEFT=0
