# X3/X3 Pro settings from the checked-out vendor SDK doc/Dataset.md.
# Confirm physical model and scan orientation before navigation.
ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
    frame_id: laser_frame
    ignore_array: ""
    baudrate: 115200
    lidar_type: 1
    device_type: 0
    isSingleChannel: true
    intensity_bit: 0
    intensity: false
    sample_rate: 3
    abnormal_check_count: 4
    fixed_resolution: false
    reversion: false
    inverted: false
    auto_reconnect: true
    support_motor_dtr: true
    angle_max: 180.0
    angle_min: -180.0
    range_max: 8.0
    range_min: 0.1
    frequency: 6.0
    invalid_range_is_inf: false
    debug: false
